<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pra.css') }}">
</head>
<body>
  <nav class="bg-gray-100 p-6 flex gap-4 justify-center">
    <a href="/about_us" class="px-6 py-3 bg-white rounded-lg shadow text-indigo-700 font-bold text-xl hover:bg-indigo-50 transition">About Us</a>
    <a href="/explore" class="px-6 py-3 bg-white rounded-lg shadow text-indigo-700 font-bold text-xl hover:bg-indigo-50 transition">Explore</a>
    <a href="/mainpage" class="px-6 py-3 bg-white rounded-lg shadow text-indigo-700 font-bold text-xl hover:bg-indigo-50 transition">Dashboard</a>
    <a href="/the_project" class="px-6 py-3 bg-white rounded-lg shadow text-indigo-700 font-bold text-xl hover:bg-indigo-50 transition">The Project</a>
  </nav>

  <div class="container">
    <aside class="sidebar">
      <h2>📊 Smart Tracker</h2>
      <nav>
        <ul>
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">Bills</a></li>
          <li><a href="#">Trips</a></li>
          <li><a href="#">Map</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
      <button id="themeToggle">🌙</button>
    </aside>

    <div class="board">
      <header>
        <h1>📋 Bill Manager</h1>
      </header>

      <section id="bill-form">
        <h2>Add a New Bill</h2>
        <form id="addBillForm">
          <input type="text" id="payer" placeholder="Payer Name" required />
          <input type="number" id="amount" placeholder="Amount" required />
          <input type="date" id="dueDate" required />
          <textarea id="description" placeholder="Payment Reference"></textarea>
          <button type="submit">Add Bill</button>
        </form>
      </section>

      <section id="bill-list">
        <h2>All Bills</h2>
        <table>
          <thead>
            <tr>
              <th>Payer</th>
              <th>Amount</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="billsTableBody"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      toggle.textContent = document.body.classList.contains('dark') ? '🌞' : '🌙';
    });
  </script>

  <script src="{{ url_for('static', filename='js/pra.js') }}"></script>
</body>
</html>
